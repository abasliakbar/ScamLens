kind = "mobile"
previewPath = "/"
title = "ScamLens"
description = "A phone-first educational app for reviewing suspicious messages and URLs, showing transparent risk indicators and a local history without claiming certainty."
version = "1.0.0"
id = "artifacts/scamlens"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22751

[services.development]
run = "pnpm --filter @workspace/scamlens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scamlens", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/scamlens", "run", "serve" ]

[services.env]
PORT = "22751"
BASE_PATH = "/"
